<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Room Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/ussr-stencil" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.55);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    background: var(--bg);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    width:100vw;
    cursor:none;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(14px, 2.4vh, 26px);
    transition: transform .5s cubic-bezier(.4,0,.2,1);
    cursor:default;
    z-index:2;
  }

  .stage.shift-right{
    transform: translateX(38vw);
    cursor:pointer;
  }

  .stage.shift-left{
    transform: translateX(-38vw);
    cursor:pointer;
  }

  .weekday{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:clamp(13px, 1.5vw, 19px);
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  .date{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:clamp(13px, 1.5vw, 19px);
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  .time-row{
    display:flex;
    align-items:baseline;
    gap:clamp(6px, 1vw, 12px);
  }

  .time{
    font-family:'USSR STENCIL';
    font-weight:400;
    font-size:clamp(88px, 20vw, 236px);
    letter-spacing:0.14em;
    color:var(--ink);
    line-height:1;
    font-variant-numeric: tabular-nums;
    padding-left:0.14em;
    transition: font-size .5s cubic-bezier(.4,0,.2,1);
  }

  .meridiem{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:clamp(14px, 1.6vw, 24px);
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--ink-dim);
    transition: font-size .5s cubic-bezier(.4,0,.2,1);
  }

  /* only the time itself shrinks when a panel is open - weekday/date stay full size */
  .stage.shift-right .time,
  .stage.shift-left .time{
    font-size:clamp(50px, 10vw, 120px);
  }

  .stage.shift-right .meridiem,
  .stage.shift-left .meridiem{
    font-size:clamp(11px, 1.1vw, 16px);
  }

  /* ---------- bottom bar: now playing + weather ---------- */

  .bottom-bar{
    position:fixed;
    left:0; right:0;
    bottom:clamp(24px, 4vh, 48px);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:0 clamp(24px, 5vw, 64px);
  }

  .now-playing{
    display:none;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition: opacity .3s ease;
  }

  .np-idle{
    display:none;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition: opacity .3s ease;
  }

  .np-idle-icon{
    width:44px;
    height:44px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .np-idle-icon svg{
    width:22px;
    height:22px;
    color:var(--ink-dim);
  }

  .np-idle-text{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:15px;
    color:var(--ink-dim);
    max-width:220px;
  }

  .np-art{
    width:80px;
    height:80px;
    border-radius:6px;
    object-fit:cover;
    background:rgba(255,255,255,0.06);
    flex-shrink:0;
  }

  .np-info{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
  }

  .np-track{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:19px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:300px;
  }

  .np-artist{
    font-family:'Quicksand', sans-serif;
    font-weight:400;
    font-size:15px;
    color:var(--ink-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:300px;
  }

  .np-progress-row{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .np-time{
    font-family:'Quicksand', sans-serif;
    font-size:12px;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }

  .np-bar-track{
    width:190px;
    height:3px;
    background:rgba(255,255,255,0.14);
    border-radius:1.5px;
    overflow:hidden;
  }

  .np-bar-fill{
    height:100%;
    width:0%;
    background:var(--ink);
  }

  .connect-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,0.25);
    color:var(--ink-dim);
    font-family:'Quicksand', sans-serif;
    font-size:13px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    padding:11px 20px;
    border-radius:4px;
    cursor:pointer;
  }

  .weather{
    display:flex;
    align-items:center;
    gap:18px;
    cursor:pointer;
    transition: opacity .3s ease;
  }

  .weather-icon svg{
    width:52px;
    height:52px;
    color:var(--ink);
  }

  .weather-info{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:4px;
  }

  .weather-temp{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:36px;
    color:var(--ink);
  }

  .weather-desc{
    font-family:'Quicksand', sans-serif;
    font-size:13px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  /* ---------- expandable side panels ---------- */

  .side-panel{
    position:fixed;
    --pm: clamp(24px, 4vh, 48px);
    top:calc(100vh - var(--pm));
    height:0;
    width:0;
    opacity:0;
    overflow:hidden;
    border-radius:24px;
    background:rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.08);
    pointer-events:none;
    transition: width .5s cubic-bezier(.4,0,.2,1), height .5s cubic-bezier(.4,0,.2,1),
                top .5s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:clamp(24px, 3.4vw, 44px);
    z-index:3;
  }

  .panel-left{ left:clamp(20px, 3.5vw, 48px); }
  .panel-right{ right:clamp(20px, 3.5vw, 48px); }

  .side-panel.expanded{
    top:var(--pm);
    height:calc(100vh - 2 * var(--pm));
    width:64vw;
    opacity:1;
    pointer-events:auto;
  }

  .mini-hidden{
    opacity:0 !important;
    pointer-events:none !important;
  }

  .panel-art{
    width:clamp(160px, 22vw, 300px);
    height:clamp(160px, 22vw, 300px);
    border-radius:14px;
    object-fit:cover;
    background:rgba(255,255,255,0.06);
    margin-bottom:clamp(22px, 3vw, 36px);
  }

  .panel-track{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:clamp(22px, 2.6vw, 32px);
    color:var(--ink);
    text-align:center;
    max-width:90%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .panel-artist{
    font-family:'Quicksand', sans-serif;
    font-weight:400;
    font-size:clamp(15px, 1.6vw, 20px);
    color:var(--ink-dim);
    margin-top:8px;
    text-align:center;
    max-width:90%;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .panel-progress-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:clamp(22px, 3vw, 34px);
    width:80%;
  }

  .panel-time{
    font-family:'Quicksand', sans-serif;
    font-size:12px;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }

  .panel-bar-track{
    flex:1;
    height:3px;
    background:rgba(255,255,255,0.14);
    border-radius:1.5px;
    overflow:hidden;
  }

  .panel-bar-fill{
    height:100%;
    width:0%;
    background:var(--ink);
  }

  .panel-controls{
    display:flex;
    align-items:center;
    gap:clamp(30px, 3.8vw, 48px);
    margin-top:clamp(26px, 3.6vw, 40px);
  }

  .panel-controls button{
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .panel-controls button svg{
    width:28px;
    height:28px;
  }

  #btnPlayPause{
    width:64px;
    height:64px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.3);
  }

  #btnPlayPause svg{
    width:24px;
    height:24px;
  }

  .panel-idle{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .panel-idle-icon{
    width:64px;
    height:64px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .panel-idle-icon svg{
    width:30px;
    height:30px;
    color:var(--ink-dim);
  }

  .panel-idle-text{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:16px;
    color:var(--ink-dim);
  }

  /* weather panel */

  .panel-weather-header{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }

  .panel-weather-icon svg{
    width:68px;
    height:68px;
    color:var(--ink);
  }

  .panel-weather-temp{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:clamp(44px, 5.4vw, 68px);
    color:var(--ink);
  }

  .panel-weather-desc{
    font-family:'Quicksand', sans-serif;
    font-size:14px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  .panel-weather-hilo{
    font-family:'Quicksand', sans-serif;
    font-size:15px;
    color:var(--ink-dim);
    margin-top:6px;
    letter-spacing:0.05em;
  }

  .panel-weather-hilo span{ color:var(--ink); }

  .panel-hourly{
    display:flex;
    gap:clamp(18px, 2.4vw, 28px);
    margin-top:clamp(30px, 4vw, 46px);
    overflow-x:auto;
    max-width:100%;
    padding:4px 2px 8px;
    scrollbar-width:none;
  }

  .panel-hourly::-webkit-scrollbar{ display:none; }

  .hour-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }

  .hour-label{
    font-family:'Quicksand', sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--ink-dim);
  }

  .hour-card svg{
    width:24px;
    height:24px;
    color:var(--ink);
  }

  .hour-temp{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:16px;
    color:var(--ink);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="time-row">
      <span class="time" id="time"></span>
      <span class="meridiem" id="meridiem"></span>
    </div>
    <div class="weekday" id="weekday"></div>
    <div class="date" id="date"></div>
  </div>

  <div class="bottom-bar">
    <div id="spotifyMiniWrap">
      <div class="now-playing" id="npWrap">
        <img class="np-art" id="npArt" alt="">
        <div class="np-info">
          <div class="np-track" id="npTrack"></div>
          <div class="np-artist" id="npArtist"></div>
          <div class="np-progress-row">
            <span class="np-time" id="npElapsed">0:00</span>
            <div class="np-bar-track"><div class="np-bar-fill" id="npBarFill"></div></div>
            <span class="np-time" id="npDuration">0:00</span>
          </div>
        </div>
      </div>
      <div class="np-idle" id="npIdle">
        <div class="np-idle-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke-width="1.3"/><path d="M6.6 9.4c3.6-1.1 7.2-.8 10.4 1" stroke-width="1.5"/><path d="M7.2 12.6c3-.9 6-.7 8.6.8" stroke-width="1.5"/><path d="M7.8 15.6c2.4-.7 4.8-.55 6.9.65" stroke-width="1.4"/></svg>
        </div>
        <div class="np-idle-text">Nothing is playing right now</div>
      </div>
      <button class="connect-btn" id="connectBtn" style="display:none;">Connect Spotify</button>
    </div>

    <div class="weather" id="weatherWrap">
      <div class="weather-info">
        <div class="weather-temp" id="weatherTemp">--°</div>
        <div class="weather-desc" id="weatherDesc">Loading</div>
      </div>
      <div class="weather-icon" id="weatherIcon"></div>
    </div>
  </div>

  <div class="side-panel panel-left" id="spotifyPanel">
    <div class="panel-now-playing" id="panelNowPlaying" style="display:none; flex-direction:column; align-items:center;">
      <img class="panel-art" id="panelArt" alt="">
      <div class="panel-track" id="panelTrack"></div>
      <div class="panel-artist" id="panelArtist"></div>
      <div class="panel-progress-row">
        <span class="panel-time" id="panelElapsed">0:00</span>
        <div class="panel-bar-track"><div class="panel-bar-fill" id="panelBarFill"></div></div>
        <span class="panel-time" id="panelDuration">0:00</span>
      </div>
      <div class="panel-controls">
        <button id="btnPrev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="2.4" height="16"/><polygon points="19,4 19,20 8,12"/></svg>
        </button>
        <button id="btnPlayPause" aria-label="Play or pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="7,4 20,12 7,20"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button id="btnNext" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="17.6" y="4" width="2.4" height="16"/><polygon points="5,4 5,20 16,12"/></svg>
        </button>
      </div>
    </div>
    <div class="panel-idle" id="panelIdle">
      <div class="panel-idle-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke-width="1.3"/><path d="M6.6 9.4c3.6-1.1 7.2-.8 10.4 1" stroke-width="1.5"/><path d="M7.2 12.6c3-.9 6-.7 8.6.8" stroke-width="1.5"/><path d="M7.8 15.6c2.4-.7 4.8-.55 6.9.65" stroke-width="1.4"/></svg>
      </div>
      <div class="panel-idle-text">Nothing is playing right now</div>
    </div>
  </div>

  <div class="side-panel panel-right" id="weatherPanel">
    <div class="panel-weather-header">
      <div class="panel-weather-icon" id="panelWeatherIcon"></div>
      <div class="panel-weather-temp" id="panelWeatherTemp">--°</div>
      <div class="panel-weather-desc" id="panelWeatherDesc"></div>
      <div class="panel-weather-hilo" id="panelWeatherHiLo"></div>
    </div>
    <div class="panel-hourly" id="panelHourly"></div>
  </div>

<script>
  const weekdayEl = document.getElementById('weekday');
  const dateEl = document.getElementById('date');
  const timeEl = document.getElementById('time');
  const meridiemEl = document.getElementById('meridiem');
  const stageEl = document.querySelector('.stage');
  const spotifyPanel = document.getElementById('spotifyPanel');
  const weatherPanel = document.getElementById('weatherPanel');
  const spotifyMiniWrap = document.getElementById('spotifyMiniWrap');
  const weatherMiniWrap = document.getElementById('weatherWrap');

  // ---------- expand / collapse state machine ----------
  let expanded = null; // null | 'spotify' | 'weather'

  function collapseAll(){
    expanded = null;
    spotifyPanel.classList.remove('expanded');
    weatherPanel.classList.remove('expanded');
    stageEl.classList.remove('shift-right', 'shift-left');
    spotifyMiniWrap.classList.remove('mini-hidden');
    weatherMiniWrap.classList.remove('mini-hidden');
  }

  function expandSpotify(){
    if(expanded === 'spotify'){ collapseAll(); return; }
    weatherPanel.classList.remove('expanded');
    weatherMiniWrap.classList.remove('mini-hidden');
    spotifyPanel.classList.add('expanded');
    spotifyMiniWrap.classList.add('mini-hidden');
    stageEl.classList.remove('shift-left');
    stageEl.classList.add('shift-right');
    expanded = 'spotify';
  }

  function expandWeather(){
    if(expanded === 'weather'){ collapseAll(); return; }
    spotifyPanel.classList.remove('expanded');
    spotifyMiniWrap.classList.remove('mini-hidden');
    weatherPanel.classList.add('expanded');
    weatherMiniWrap.classList.add('mini-hidden');
    stageEl.classList.remove('shift-right');
    stageEl.classList.add('shift-left');
    expanded = 'weather';
  }

  stageEl.addEventListener('click', () => { if(expanded) collapseAll(); });
  document.getElementById('npWrap').addEventListener('click', expandSpotify);
  document.getElementById('npIdle').addEventListener('click', expandSpotify);
  document.getElementById('weatherWrap').addEventListener('click', expandWeather);

  const weekdays = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

  function pad(n){ return n.toString().padStart(2,'0'); }

  function render(){
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const meridiem = h >= 12 ? 'PM' : 'AM';
    h = h % 12;
    if(h === 0) h = 12;

    timeEl.textContent = `${h}:${pad(m)}`;
    meridiemEl.textContent = meridiem;
    weekdayEl.textContent = weekdays[now.getDay()];
    dateEl.textContent = `${now.getDate()} ${months[now.getMonth()]}, ${now.getFullYear()}.`;
  }

  render();
  setInterval(render, 1000);

  // Keep the screen awake while this page is active, where supported.
  let wakeLock = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
      }
    }catch(e){ /* Guided Access + Auto-Lock: Never is the fallback */ }
  }
  requestWakeLock();
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible') requestWakeLock();
  });

  // ================= WEATHER (Open-Meteo, no API key needed) =================

  const FALLBACK_LAT = 29.6516, FALLBACK_LON = -82.3248; // Gainesville, FL fallback

  const weatherIcons = {
    clear: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/><line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/></svg>`,
    cloud: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 16.9 8.5 4.5 4.5 0 0 1 16 18H6.5z"/></svg>`,
    rain: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 16.9 5.5 4.5 4.5 0 0 1 16 15H6.5z"/><line x1="8" y1="18" x2="7" y2="21"/><line x1="12" y1="18" x2="11" y2="21"/><line x1="16" y1="18" x2="15" y2="21"/></svg>`,
    snow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 15a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 16.9 5.5 4.5 4.5 0 0 1 16 15H6.5z"/><line x1="8" y1="18" x2="8" y2="21"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="16" y1="18" x2="16" y2="21"/></svg>`,
    storm: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 14a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 16.9 4.5 4.5 4.5 0 0 1 16 14H6.5z"/><polyline points="12,15 10,19 13,19 11,23"/></svg>`,
    fog: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="13" x2="20" y2="13"/><line x1="4" y1="17" x2="20" y2="17"/></svg>`
  };

  function weatherFromCode(code){
    if(code === 0) return {icon:'clear', desc:'Clear'};
    if([1,2,3].includes(code)) return {icon:'cloud', desc: code===1?'Mostly Clear':code===2?'Partly Cloudy':'Overcast'};
    if([45,48].includes(code)) return {icon:'fog', desc:'Fog'};
    if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return {icon:'rain', desc:'Rain'};
    if([71,73,75,77,85,86].includes(code)) return {icon:'snow', desc:'Snow'};
    if([95,96,99].includes(code)) return {icon:'storm', desc:'Storm'};
    return {icon:'cloud', desc:'--'};
  }

  async function fetchWeather(lat, lon){
    try{
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`);
      const data = await res.json();

      const temp = Math.round(data.current.temperature_2m);
      const w = weatherFromCode(data.current.weather_code);
      document.getElementById('weatherTemp').textContent = temp + '°';
      document.getElementById('weatherDesc').textContent = w.desc.toUpperCase();
      document.getElementById('weatherIcon').innerHTML = weatherIcons[w.icon];

      // mirror into the expanded panel header
      document.getElementById('panelWeatherTemp').textContent = temp + '°';
      document.getElementById('panelWeatherDesc').textContent = w.desc.toUpperCase();
      document.getElementById('panelWeatherIcon').innerHTML = weatherIcons[w.icon];

      const hi = Math.round(data.daily.temperature_2m_max[0]);
      const lo = Math.round(data.daily.temperature_2m_min[0]);
      document.getElementById('panelWeatherHiLo').innerHTML = `<span>${hi}°</span> / <span>${lo}°</span>`;

      // hourly strip - next 12 hours from right now
      const nowHourIdx = new Date().getHours();
      const times = data.hourly.time.slice(nowHourIdx, nowHourIdx + 12);
      const temps = data.hourly.temperature_2m.slice(nowHourIdx, nowHourIdx + 12);
      const codes = data.hourly.weather_code.slice(nowHourIdx, nowHourIdx + 12);

      const hourlyEl = document.getElementById('panelHourly');
      hourlyEl.innerHTML = times.map((t, i) => {
        const hh = parseInt(t.substring(11, 13), 10);
        const period = hh >= 12 ? 'PM' : 'AM';
        let h12 = hh % 12; if(h12 === 0) h12 = 12;
        const hw = weatherFromCode(codes[i]);
        return `<div class="hour-card">
          <div class="hour-label">${i === 0 ? 'NOW' : h12 + period}</div>
          ${weatherIcons[hw.icon]}
          <div class="hour-temp">${Math.round(temps[i])}°</div>
        </div>`;
      }).join('');
    }catch(e){
      document.getElementById('weatherDesc').textContent = 'Unavailable';
    }
  }

  function initWeather(){
    if('geolocation' in navigator){
      navigator.geolocation.getCurrentPosition(
        pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
        () => fetchWeather(FALLBACK_LAT, FALLBACK_LON),
        { timeout: 5000 }
      );
    } else {
      fetchWeather(FALLBACK_LAT, FALLBACK_LON);
    }
  }

  initWeather();
  setInterval(initWeather, 15 * 60 * 1000);

  // ================= SPOTIFY NOW PLAYING (Authorization Code + PKCE) =================
  // Fill in your own Client ID after registering an app at developer.spotify.com/dashboard
  const SPOTIFY_CLIENT_ID = '7025f027be314eb9a1cd08e9b3b23968';
  const SPOTIFY_REDIRECT_URI = window.location.origin + window.location.pathname;
  const SPOTIFY_SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state';

  function generateRandomString(length){
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let result = '';
    const values = crypto.getRandomValues(new Uint8Array(length));
    values.forEach(v => result += chars[v % chars.length]);
    return result;
  }

  async function sha256(plain){
    const data = new TextEncoder().encode(plain);
    return await crypto.subtle.digest('SHA-256', data);
  }

  function base64urlencode(buffer){
    let str = '';
    const bytes = new Uint8Array(buffer);
    bytes.forEach(b => str += String.fromCharCode(b));
    return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async function spotifyLogin(){
    const verifier = generateRandomString(64);
    localStorage.setItem('sp_verifier', verifier);
    const challenge = base64urlencode(await sha256(verifier));
    const params = new URLSearchParams({
      client_id: SPOTIFY_CLIENT_ID,
      response_type: 'code',
      redirect_uri: SPOTIFY_REDIRECT_URI,
      scope: SPOTIFY_SCOPES,
      code_challenge_method: 'S256',
      code_challenge: challenge
    });
    window.location = 'https://accounts.spotify.com/authorize?' + params.toString();
  }

  function saveSpotifyTokens(data){
    localStorage.setItem('sp_access_token', data.access_token);
    if(data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
    localStorage.setItem('sp_expires_at', Date.now() + (data.expires_in * 1000));
  }

  async function handleSpotifyRedirect(){
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if(!code) return;
    const verifier = localStorage.getItem('sp_verifier');
    const body = new URLSearchParams({
      client_id: SPOTIFY_CLIENT_ID,
      grant_type: 'authorization_code',
      code,
      redirect_uri: SPOTIFY_REDIRECT_URI,
      code_verifier: verifier
    });
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body
    });
    const data = await res.json();
    if(data.access_token){
      saveSpotifyTokens(data);
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }

  async function getValidSpotifyToken(){
    const expiresAt = parseInt(localStorage.getItem('sp_expires_at') || '0');
    if(Date.now() < expiresAt - 30000){
      return localStorage.getItem('sp_access_token');
    }
    const refreshToken = localStorage.getItem('sp_refresh_token');
    if(!refreshToken) return null;
    const body = new URLSearchParams({
      client_id: SPOTIFY_CLIENT_ID,
      grant_type: 'refresh_token',
      refresh_token: refreshToken
    });
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body
    });
    const data = await res.json();
    if(data.access_token){
      saveSpotifyTokens({...data, refresh_token: data.refresh_token || refreshToken});
      return data.access_token;
    }
    return null;
  }

  let localProgress = 0, localDuration = 0, isPlayingNow = false;

  function formatMs(ms){
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${m}:${s.toString().padStart(2, '0')}`;
  }

  function renderProgress(){
    const pct = localDuration ? Math.min(100, (localProgress / localDuration) * 100) : 0;
    document.getElementById('npBarFill').style.width = pct + '%';
    document.getElementById('npElapsed').textContent = formatMs(localProgress);
    document.getElementById('npDuration').textContent = formatMs(localDuration);
    document.getElementById('panelBarFill').style.width = pct + '%';
    document.getElementById('panelElapsed').textContent = formatMs(localProgress);
    document.getElementById('panelDuration').textContent = formatMs(localDuration);
  }

  function setPlayPauseIcon(){
    document.getElementById('playIcon').style.display = isPlayingNow ? 'none' : '';
    document.getElementById('pauseIcon').style.display = isPlayingNow ? '' : 'none';
  }

  function showConnectPrompt(){
    document.getElementById('npWrap').style.display = 'none';
    document.getElementById('npIdle').style.display = 'none';
    document.getElementById('connectBtn').style.display = 'inline-block';
  }

  function showNothingPlaying(){
    document.getElementById('npWrap').style.display = 'none';
    document.getElementById('npIdle').style.display = 'flex';
    document.getElementById('connectBtn').style.display = 'none';
    document.getElementById('panelNowPlaying').style.display = 'none';
    document.getElementById('panelIdle').style.display = 'flex';
  }

  function updateNowPlaying(data){
    document.getElementById('npWrap').style.display = 'flex';
    document.getElementById('npIdle').style.display = 'none';
    document.getElementById('connectBtn').style.display = 'none';
    document.getElementById('panelNowPlaying').style.display = 'flex';
    document.getElementById('panelIdle').style.display = 'none';

    const art = data.item.album.images[0]?.url || '';
    const track = data.item.name;
    const artist = data.item.artists.map(a => a.name).join(', ');

    document.getElementById('npArt').src = art;
    document.getElementById('npTrack').textContent = track;
    document.getElementById('npArtist').textContent = artist;
    document.getElementById('panelArt').src = art;
    document.getElementById('panelTrack').textContent = track;
    document.getElementById('panelArtist').textContent = artist;

    localProgress = data.progress_ms;
    localDuration = data.item.duration_ms;
    isPlayingNow = data.is_playing;
    renderProgress();
    setPlayPauseIcon();
  }

  async function pollNowPlaying(){
    const token = await getValidSpotifyToken();
    if(!token){ showConnectPrompt(); return; }
    try{
      const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { Authorization: 'Bearer ' + token }
      });
      if(res.status === 204){ showNothingPlaying(); return; }
      if(res.status === 401){ showConnectPrompt(); return; }
      const data = await res.json();
      if(!data || !data.item){ showNothingPlaying(); return; }
      updateNowPlaying(data);
    }catch(e){ /* network hiccup - keep last known state on screen */ }
  }

  // smooth the progress bar between the ~8s polls
  setInterval(() => {
    if(isPlayingNow && localDuration){
      localProgress = Math.min(localDuration, localProgress + 1000);
      renderProgress();
    }
  }, 1000);

  document.getElementById('connectBtn').addEventListener('click', spotifyLogin);

  // ---------- playback controls ----------
  async function spotifyControl(method, endpoint){
    const token = await getValidSpotifyToken();
    if(!token) return;
    try{
      await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
        method,
        headers: { Authorization: 'Bearer ' + token }
      });
    }catch(e){ /* device may be offline - nothing more we can do here */ }
    // give Spotify a beat to update, then resync real state
    setTimeout(pollNowPlaying, 400);
  }

  document.getElementById('btnPlayPause').addEventListener('click', (e) => {
    e.stopPropagation();
    // optimistic flip so the icon feels instant
    isPlayingNow = !isPlayingNow;
    setPlayPauseIcon();
    spotifyControl('PUT', isPlayingNow ? 'play' : 'pause');
  });
  document.getElementById('btnNext').addEventListener('click', (e) => {
    e.stopPropagation();
    spotifyControl('POST', 'next');
  });
  document.getElementById('btnPrev').addEventListener('click', (e) => {
    e.stopPropagation();
    spotifyControl('POST', 'previous');
  });
  // keep taps inside the panel from bubbling up and collapsing it
  spotifyPanel.addEventListener('click', (e) => e.stopPropagation());
  weatherPanel.addEventListener('click', (e) => e.stopPropagation());

  (async function initSpotify(){
    await handleSpotifyRedirect();
    pollNowPlaying();
    setInterval(pollNowPlaying, 8000);
  })();
</script>
