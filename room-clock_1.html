<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Room Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.cdnfonts.com/css/star-killers" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --ink: #ffffff;
    --ink-dim: rgba(255,255,255,0.55);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
    background: var(--bg);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    width:100vw;
    cursor:none;
  }

  /* ---------- ambient weather edge glow ---------- */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    opacity:0;
    transition:opacity 1.8s ease, box-shadow 1.8s ease;
    box-shadow:inset 0 0 0 0 transparent;
  }

  body.ambient-day::before{
    opacity:1;
    box-shadow:inset 0 0 110px 18px rgba(255,218,150,0.10);
  }

  body.ambient-rain::before{
    opacity:1;
    box-shadow:inset 0 0 125px 22px rgba(90,175,210,0.20);
  }

  body.ambient-sunset::before{
    opacity:1;
    box-shadow:inset 0 0 135px 24px rgba(255,130,75,0.18);
  }

  /* album-art glow stays local to the artwork */
  .np-art, .panel-art{
    box-shadow:0 0 0 rgba(255,255,255,0);
    transition:box-shadow 1.2s ease;
  }

  .stage{
    position:fixed;
    top:50%;
    left:50%;
    transform: translate(-50%, -50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(14px, 2.4vh, 26px);
    transition: left .5s cubic-bezier(.4,0,.2,1);
    cursor:default;
    z-index:2;
  }

  .stage.shift-right{
    left:78%;
    cursor:pointer;
  }

  .stage.shift-left{
    left:20%;
    cursor:pointer;
  }

  .weekday{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:clamp(13px, 1.5vw, 19px);
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  .date{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:clamp(13px, 1.5vw, 19px);
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  .time-row{
    display:flex;
    align-items:baseline;
    gap:clamp(6px, 1vw, 12px);
  }

  .time{
    font-family:'Star Killers';
    font-weight:400;
    font-size:clamp(76px, 17vw, 210px);
    letter-spacing:0.06em;
    color:var(--ink);
    line-height:1;
    font-variant-numeric: tabular-nums;
    padding-left:0.06em;
    transition: font-size .5s cubic-bezier(.4,0,.2,1);
  }

  .meridiem{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:clamp(14px, 1.6vw, 24px);
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--ink-dim);
    transition: font-size .5s cubic-bezier(.4,0,.2,1);
  }

  /* only the time itself shrinks when a panel is open - weekday/date stay full size */
  .stage.shift-right .time,
  .stage.shift-left .time{
    font-size:clamp(46px, 8.5vw, 105px);
  }

  .stage.shift-right .meridiem,
  .stage.shift-left .meridiem{
    font-size:clamp(11px, 1.1vw, 16px);
  }

  /* ---------- bottom bar: now playing + weather ---------- */

  .bottom-bar{
    position:fixed;
    left:0; right:0;
    bottom:clamp(24px, 4vh, 48px);
    height:80px;
    padding:0 clamp(24px, 5vw, 64px);
    pointer-events:none;
  }

  /* Anchor the two mini widgets independently.
     This prevents one widget disappearing from changing the other's position. */
  #spotifyMiniWrap{
    position:absolute;
    left:clamp(24px, 5vw, 64px);
    bottom:0;
    pointer-events:auto;
  }

  #weatherWrap{
    position:absolute;
    right:clamp(24px, 5vw, 64px);
    bottom:0;
    pointer-events:auto;
  }

  .now-playing{
    display:none;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition: opacity .12s ease;
  }

  .np-idle{
    display:none;
    align-items:center;
    gap:14px;
    cursor:pointer;
    transition: opacity .12s ease;
  }

  .np-idle-icon{
    width:44px;
    height:44px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .np-idle-icon svg{
    width:22px;
    height:22px;
    color:var(--ink-dim);
  }

  .np-idle-text{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:15px;
    color:var(--ink-dim);
    max-width:220px;
  }

  .np-art{
    width:80px;
    height:80px;
    border-radius:6px;
    object-fit:cover;
    background:rgba(255,255,255,0.06);
    flex-shrink:0;
  }

  .np-info{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
    width:340px;
  }

  .marquee-mask{
    width:100%;
    overflow:hidden;
  }

  .marquee-track{
    display:inline-block;
    white-space:nowrap;
    will-change: transform;
  }

  .marquee-track.animate{
    animation-name: marquee-scroll;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }

  @keyframes marquee-scroll{
    0%, 12% { transform: translateX(0); }
    88%, 100% { transform: translateX(var(--marquee-dist, 0)); }
  }

  .np-track{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:19px;
    color:var(--ink);
  }

  .np-artist{
    font-family:'Quicksand', sans-serif;
    font-weight:400;
    font-size:15px;
    color:var(--ink-dim);
  }

  .np-progress-row{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .np-time{
    font-family:'Quicksand', sans-serif;
    font-size:12px;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }

  .np-bar-track{
    width:190px;
    height:3px;
    background:rgba(255,255,255,0.14);
    border-radius:1.5px;
    overflow:hidden;
  }

  .np-bar-fill{
    height:100%;
    width:0%;
    background:var(--ink);
  }

  .connect-btn{
    background:transparent;
    border:1px solid rgba(255,255,255,0.25);
    color:var(--ink-dim);
    font-family:'Quicksand', sans-serif;
    font-size:13px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    padding:11px 20px;
    border-radius:4px;
    cursor:pointer;
  }

  .weather{
    display:flex;
    align-items:center;
    gap:18px;
    cursor:pointer;
    transition: opacity .12s ease;
  }

  .weather-icon svg{
    width:52px;
    height:52px;
    color:var(--ink);
  }

  .weather-info{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:4px;
  }

  .weather-temp{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:36px;
    color:var(--ink);
  }

  .weather-desc{
    font-family:'Quicksand', sans-serif;
    font-size:13px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  /* ---------- expandable side panels ---------- */

  .side-panel{
    position:fixed;
    --pm: clamp(24px, 4vh, 48px);
    top:calc(100vh - var(--pm));
    height:0;
    width:0;
    opacity:0;
    overflow:hidden;
    border-radius:24px;
    background:rgba(255,255,255,0.045);
    border:1px solid rgba(255,255,255,0.08);
    pointer-events:none;
    transition: width .5s cubic-bezier(.4,0,.2,1), height .5s cubic-bezier(.4,0,.2,1),
                top .5s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-evenly;
    padding:clamp(24px, 3.4vw, 44px);
    z-index:3;
  }

  .panel-left{ left:clamp(20px, 3.5vw, 48px); }
  .panel-right{ right:clamp(20px, 3.5vw, 48px); }

  .side-panel.expanded{
    top:var(--pm);
    height:calc(100vh - 2 * var(--pm));
    width:56vw;
    opacity:1;
    pointer-events:auto;
  }

  .mini-hidden{
    opacity:0 !important;
    pointer-events:none !important;
  }

  .panel-art{
    width:clamp(190px, 25vw, 340px);
    height:clamp(190px, 25vw, 340px);
    border-radius:16px;
    object-fit:cover;
    background:rgba(255,255,255,0.06);
    margin-bottom:clamp(30px, 4vw, 48px);
  }

  .panel-track{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:clamp(22px, 2.6vw, 32px);
    color:var(--ink);
    text-align:center;
  }

  .panel-artist{
    font-family:'Quicksand', sans-serif;
    font-weight:400;
    font-size:clamp(15px, 1.6vw, 20px);
    color:var(--ink-dim);
    margin-top:8px;
    text-align:center;
  }

  #panelNowPlaying{
    width:88%;
  }

  #panelNowPlaying .marquee-mask{
    display:flex;
    justify-content:center;
  }

  #panelNowPlaying .marquee-track.animate{
    /* panel text centers by default; once scrolling, left-align so the
       translateX math (measured from the left edge) is accurate */
    display:block;
    text-align:left;
  }

  .panel-progress-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin-top:clamp(30px, 4vw, 46px);
    width:80%;
  }

  .panel-time{
    font-family:'Quicksand', sans-serif;
    font-size:12px;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }

  .panel-bar-track{
    flex:1;
    height:3px;
    background:rgba(255,255,255,0.14);
    border-radius:1.5px;
    overflow:hidden;
  }

  .panel-bar-fill{
    height:100%;
    width:0%;
    background:var(--ink);
  }

  .panel-controls{
    display:flex;
    align-items:center;
    gap:clamp(30px, 3.8vw, 48px);
    margin-top:clamp(34px, 4.6vw, 52px);
  }

  .panel-controls button{
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .panel-controls button svg{
    width:28px;
    height:28px;
  }

  #btnPlayPause{
    width:64px;
    height:64px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.3);
  }

  #btnPlayPause svg{
    width:24px;
    height:24px;
  }

  .panel-idle{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }

  .panel-idle-icon{
    width:64px;
    height:64px;
    border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .panel-idle-icon svg{
    width:30px;
    height:30px;
    color:var(--ink-dim);
  }

  .panel-idle-text{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:16px;
    color:var(--ink-dim);
  }

  /* weather panel */

  .panel-weather-header{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    transform:translateY(clamp(18px, 2.2vw, 30px));
  }

  .panel-weather-icon svg{
    width:68px;
    height:68px;
    color:var(--ink);
  }

  .panel-weather-temp{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:clamp(44px, 5.4vw, 68px);
    color:var(--ink);
  }

  .panel-weather-desc{
    font-family:'Quicksand', sans-serif;
    font-size:14px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--ink-dim);
  }

  .panel-weather-hilo{
    font-family:'Quicksand', sans-serif;
    font-size:15px;
    color:var(--ink-dim);
    margin-top:6px;
    letter-spacing:0.05em;
  }

  .panel-weather-hilo span{ color:var(--ink); }

  /* ---------- weather panel background layers (sky arc + rain) ---------- */

  .panel-sky-bg{
    position:absolute;
    left:0; right:0;
    top:clamp(44px, 6vw, 72px);
    height:120px;
    z-index:-1;
    pointer-events:none;
  }

  .sky-arc{
    width:100%;
    height:100%;
    display:block;
  }

  .sky-time{
    position:absolute;
    bottom:2px;
    font-family:'Quicksand', sans-serif;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--ink-dim);
    opacity:0.65;
  }

  .sky-time-left{ left:12%; }
  .sky-time-right{ right:12%; }

  .panel-rain-bg{
    position:absolute;
    inset:0;
    z-index:-1;
    opacity:0;
    transition:opacity 1.2s ease;
    background-image: repeating-linear-gradient(112deg,
      rgba(255,255,255,0.12) 0px, rgba(255,255,255,0.12) 1px,
      transparent 1px, transparent 15px);
    background-size: 140px 140px;
  }

  .panel-rain-bg.active{
    opacity:1;
    animation: rain-fall 0.7s linear infinite;
  }

  @keyframes rain-fall{
    from{ background-position: 0 0; }
    to{ background-position: -32px 55px; }
  }

  .hour-precip{
    font-family:'Quicksand', sans-serif;
    font-size:10px;
    color:var(--ink-dim);
    opacity:0.75;
    margin-top:-4px;
  }

  .panel-hourly{
    display:flex;
    gap:clamp(18px, 2.4vw, 28px);
    margin-top:clamp(30px, 4vw, 46px);
    overflow-x:auto;
    max-width:100%;
    padding:4px 2px 8px;
    scrollbar-width:none;
  }

  .panel-hourly::-webkit-scrollbar{ display:none; }

  .hour-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }

  .hour-label{
    font-family:'Quicksand', sans-serif;
    font-size:12px;
    letter-spacing:0.1em;
    color:var(--ink-dim);
  }

  .hour-card svg{
    width:24px;
    height:24px;
    color:var(--ink);
  }

  .hour-temp{
    font-family:'Quicksand', sans-serif;
    font-weight:500;
    font-size:16px;
    color:var(--ink);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="time-row">
      <span class="time" id="time"></span>
      <span class="meridiem" id="meridiem"></span>
    </div>
    <div class="weekday" id="weekday"></div>
    <div class="date" id="date"></div>
  </div>

  <div class="bottom-bar">
    <div id="spotifyMiniWrap">
      <div class="now-playing" id="npWrap">
        <img class="np-art" id="npArt" alt="">
        <div class="np-info">
          <div class="marquee-mask"><span class="np-track marquee-track" id="npTrack"></span></div>
          <div class="marquee-mask"><span class="np-artist marquee-track" id="npArtist"></span></div>
          <div class="np-progress-row">
            <span class="np-time" id="npElapsed">0:00</span>
            <div class="np-bar-track"><div class="np-bar-fill" id="npBarFill"></div></div>
            <span class="np-time" id="npDuration">0:00</span>
          </div>
        </div>
      </div>
      <div class="np-idle" id="npIdle">
        <div class="np-idle-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke-width="1.3"/><path d="M6.6 9.4c3.6-1.1 7.2-.8 10.4 1" stroke-width="1.5"/><path d="M7.2 12.6c3-.9 6-.7 8.6.8" stroke-width="1.5"/><path d="M7.8 15.6c2.4-.7 4.8-.55 6.9.65" stroke-width="1.4"/></svg>
        </div>
        <div class="np-idle-text">Nothing is playing right now</div>
      </div>
      <button class="connect-btn" id="connectBtn" style="display:none;">Connect Spotify</button>
    </div>

    <div class="weather" id="weatherWrap">
      <div class="weather-info">
        <div class="weather-temp" id="weatherTemp">--°</div>
        <div class="weather-desc" id="weatherDesc">Loading</div>
      </div>
      <div class="weather-icon" id="weatherIcon"></div>
    </div>
  </div>

  <div class="side-panel panel-left" id="spotifyPanel">
    <div class="panel-now-playing" id="panelNowPlaying" style="display:none; flex-direction:column; align-items:center;">
      <img class="panel-art" id="panelArt" alt="">
      <div class="marquee-mask"><span class="panel-track marquee-track" id="panelTrack"></span></div>
      <div class="marquee-mask"><span class="panel-artist marquee-track" id="panelArtist"></span></div>
      <div class="panel-progress-row">
        <span class="panel-time" id="panelElapsed">0:00</span>
        <div class="panel-bar-track"><div class="panel-bar-fill" id="panelBarFill"></div></div>
        <span class="panel-time" id="panelDuration">0:00</span>
      </div>
      <div class="panel-controls">
        <button id="btnPrev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="2.4" height="16"/><polygon points="19,4 19,20 8,12"/></svg>
        </button>
        <button id="btnPlayPause" aria-label="Play or pause">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="7,4 20,12 7,20"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button id="btnNext" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="17.6" y="4" width="2.4" height="16"/><polygon points="5,4 5,20 16,12"/></svg>
        </button>
      </div>
    </div>
    <div class="panel-idle" id="panelIdle">
      <div class="panel-idle-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke-width="1.3"/><path d="M6.6 9.4c3.6-1.1 7.2-.8 10.4 1" stroke-width="1.5"/><path d="M7.2 12.6c3-.9 6-.7 8.6.8" stroke-width="1.5"/><path d="M7.8 15.6c2.4-.7 4.8-.55 6.9.65" stroke-width="1.4"/></svg>
      </div>
      <div class="panel-idle-text">Nothing is playing right now</div>
    </div>
  </div>

  <div class="side-panel panel-right" id="weatherPanel">
    <div class="panel-rain-bg" id="panelRainBg"></div>
    <div class="panel-sky-bg" id="panelSkyBg">
      <svg class="sky-arc" viewBox="0 0 300 110" preserveAspectRatio="xMidYMax meet">
        <path d="M40 95 A 110 110 0 0 1 260 95" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
        <circle id="skyDot" cx="40" cy="95" r="5" fill="rgba(255,255,255,0.85)"/>
      </svg>
      <div class="sky-time sky-time-left" id="skyStartLabel"></div>
      <div class="sky-time sky-time-right" id="skyEndLabel"></div>
    </div>
    <div class="panel-weather-header">
      <div class="panel-weather-icon" id="panelWeatherIcon"></div>
      <div class="panel-weather-temp" id="panelWeatherTemp">--°</div>
      <div class="panel-weather-desc" id="panelWeatherDesc"></div>
      <div class="panel-weather-hilo" id="panelWeatherHiLo"></div>
    </div>
    <div class="panel-hourly" id="panelHourly"></div>
  </div>

<script>
  const weekdayEl = document.getElementById('weekday');
  const dateEl = document.getElementById('date');
  const timeEl = document.getElementById('time');
  const meridiemEl = document.getElementById('meridiem');
  const stageEl = document.querySelector('.stage');
  const spotifyPanel = document.getElementById('spotifyPanel');
  const weatherPanel = document.getElementById('weatherPanel');
  const spotifyMiniWrap = document.getElementById('spotifyMiniWrap');
  const weatherMiniWrap = document.getElementById('weatherWrap');

  // ---------- expand / collapse state machine ----------
  let expanded = null; // null | 'spotify' | 'weather'

  function hideMini(el){
    clearTimeout(el._hideTimer);
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
    el._hideTimer = setTimeout(() => { el.style.display = 'none'; }, 150);
  }

  function showMini(el){
    clearTimeout(el._hideTimer);
    el.style.display = '';
    // force a layout flush so the fade-in actually animates instead of
    // jumping straight to opaque
    void el.offsetWidth;
    el.style.opacity = '';
    el.style.pointerEvents = '';
  }

  function collapseAll(){
    expanded = null;
    spotifyPanel.classList.remove('expanded');

  function weatherFromCode(code, isDay){
    if(code === 0) return {icon: isDay ? 'sun' : 'moon', desc:'Clear'};
    if([1,2].includes(code)) return {icon: isDay ? 'cloud-sun' : 'cloud-moon', desc: code===1?'Mostly Clear':'Partly Cloudy'};
    if(code === 3) return {icon:'cloud', desc:'Overcast'};
    if([45,48].includes(code)) return {icon:'fog', desc:'Fog'};
    if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return {icon:'rain', desc:'Rain'};
    if([71,73,75,77,85,86].includes(code)) return {icon:'snow', desc:'Snow'};
    if([95,96,99].includes(code)) return {icon:'storm', desc:'Storm'};
    return {icon:'cloud', desc:'--'};
  }

  function fmtClock(d){
    let h = d.getHours(), m = d.getMinutes();
    const period = h >= 12 ? 'PM' : 'AM';

    return `${h12}:${m.toString().padStart(2, '0')} ${period}`;
  }

  // Positions a dot along a sunrise->sunset (or sunset->next-sunrise) arc
  // based on how far through that period we currently are. Purely decorative.
  function renderSkyArc(data, isDay){
    const now = new Date();
    let start, end;
    if(isDay){
      start = new Date(data.daily.sunrise[0]);
      end = new Date(data.daily.sunset[0]);
    } else {
      const sunriseToday = new Date(data.daily.sunrise[0]);
      if(now < sunriseToday){
        // pre-dawn: the night began with "yesterday's" sunset, which we
        // don't have - approximate using today's sunset minus 24h
        start = new Date(new Date(data.daily.sunset[0]).getTime() - 24 * 60 * 60 * 1000);
        end = sunriseToday;
      } else {
        start = new Date(data.daily.sunset[0]);
        end = new Date(data.daily.sunrise[1] || sunriseToday);
      }
    }
    const frac = Math.max(0, Math.min(1, (now - start) / (end - start)));
    const theta = Math.PI * (1 - frac);
    const cx = 150, cy = 95, r = 110;
    const dotX = cx + r * Math.cos(theta);
    const dotY = cy - r * Math.sin(theta);
    const dot = document.getElementById('skyDot');
    dot.setAttribute('cx', dotX.toFixed(1));
    dot.setAttribute('cy', dotY.toFixed(1));
    document.getElementById('skyStartLabel').textContent = fmtClock(start);
    document.getElementById('skyEndLabel').textContent = fmtClock(end);
  }

async function fetchWeather(lat, lon){
    try{
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,weather_code,is_day,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&temperature_unit=fahrenheit&timezone=auto`);
      const data = await res.json();

      const isDay = data.current.is_day === 1;
      const temp = Math.round(data.current.temperature_2m);
      const w = weatherFromCode(data.current.weather_code, isDay);
      document.getElementById('weatherTemp').textContent = temp + '°';
      document.getElementById('weatherDesc').textContent = w.desc.toUpperCase();
      document.getElementById('weatherIcon').innerHTML = weatherIcons[w.icon];

      // mirror into the expanded panel header
      document.getElementById('panelWeatherTemp').textContent = temp + '°';
      document.getElementById('panelWeatherDesc').textContent = w.desc.toUpperCase();
      document.getElementById('panelWeatherIcon').innerHTML = weatherIcons[w.icon];

      const hi = Math.round(data.daily.temperature_2m_max[0]);
      const lo = Math.round(data.daily.temperature_2m_min[0]);
      document.getElementById('panelWeatherHiLo').innerHTML = `<span>${hi}°</span> / <span>${lo}°</span>`;

      // Ambient edge glow: sunset/sunrise hour > rain > normal daytime > night.
      updateAmbientWeather(data, w.icon);

      // Sky arc + rain background - subtle, decorative layers behind the panel content
      renderSkyArc(data, isDay);
      // test override: add ?rain=1 to the URL to force the rain animation on
      const forceRain = new URLSearchParams(window.location.search).get('rain') === '1';
      updateRainBg(forceRain ? 'rain' : w.icon);

      // hourly strip - next 12 hours from right now
      const nowHourIdx = new Date().getHours();
      const times = data.hourly.time.slice(nowHourIdx, nowHourIdx + 12);
      const temps = data.hourly.temperature_2m.slice(nowHourIdx, nowHourIdx + 12);
      const codes = data.hourly.weather_code.slice(nowHourIdx, nowHourIdx + 12);
      const isDays = data.hourly.is_day.slice(nowHourIdx, nowHourIdx + 12);
      const precips = data.hourly.precipitation_probability.slice(nowHourIdx, nowHourIdx + 12);

      const hourlyEl = document.getElementById('panelHourly');
      hourlyEl.innerHTML = times.map((t, i) => {
        const hh = parseInt(t.substring(11, 13), 10);
        const period = hh >= 12 ? 'PM' : 'AM';
        let h12 = hh % 12; if(h12 === 0) h12 = 12;
        const hw = weatherFromCode(codes[i], isDays[i] === 1);
        return `<div class="hour-card">
          <div class="hour-label">${i === 0 ? 'NOW' : h12 + period}</div>
          ${weatherIcons[hw.icon]}
          <div class="hour-temp">${Math.round(temps[i])}°</div>
          <div class="hour-precip">${precips[i]}%</div>
        </div>`;
      }).join('');
    }catch(e){
      document.getElementById('weatherDesc').textContent = 'Unavailable';
    }
  }

  // Fill in your own Client ID after registering an app at developer.spotify.com/dashboard
  const SPOTIFY_CLIENT_ID = '7025f027be314eb9a1cd08e9b3b23968';
  const SPOTIFY_REDIRECT_URI = window.location.origin + window.location.pathname;
  const SPOTIFY_SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state';

  function generateRandomString(length){
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let result = '';
    const values = crypto.getRandomValues(new Uint8Array(length));
    values.forEach(v => result += chars[v % chars.length]);
    return result;
  }

  async function sha256(plain){
    const data = new TextEncoder().encode(plain);
    return await crypto.subtle.digest('SHA-256', data);
  }

  function base64urlencode(buffer){
    let str = '';
    const bytes = new Uint8Array(buffer);
    bytes.forEach(b => str += String.fromCharCode(b));
    return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async function spotifyLogin(){
    const verifier = generateRandomString(64);
    localStorage.setItem('sp_verifier', verifier);
    const challenge = base64urlencode(await sha256(verifier));
    const params = new URLSearchParams({
      client_id: SPOTIFY_CLIENT_ID,
      response_type: 'code',
      redirect_uri: SPOTIFY_REDIRECT_URI,
      scope: SPOTIFY_SCOPES,
      code_challenge_method: 'S256',
      code_challenge: challenge
    });
    window.location = 'https://accounts.spotify.com/authorize?' + params.toString();
  }

  function saveSpotifyTokens(data){
    localStorage.setItem('sp_access_token', data.access_token);
    if(data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
    localStorage.setItem('sp_expires_at', Date.now() + (data.expires_in * 1000));
  }

  async function handleSpotifyRedirect(){
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if(!code) return;
    const verifier = localStorage.getItem('sp_verifier');
    const body = new URLSearchParams({
      client_id: SPOTIFY_CLIENT_ID,
      grant_type: 'authorization_code',
      code,
      redirect_uri: SPOTIFY_REDIRECT_URI,
      code_verifier: verifier
    });
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body
    });
    const data = await res.json();
    if(data.access_token){
      saveSpotifyTokens(data);
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  }

  async function getValidSpotifyToken(){
    const expiresAt = parseInt(localStorage.getItem('sp_expires_at') || '0');
    if(Date.now() < expiresAt - 30000){
      return localStorage.getItem('sp_access_token');
    }
    const refreshToken = localStorage.getItem('sp_refresh_token');
    if(!refreshToken) return null;
    const body = new URLSearchParams({
      client_id: SPOTIFY_CLIENT_ID,
      grant_type: 'refresh_token',
      refresh_token: refreshToken
    });
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body
    });
    const data = await res.json();
    if(data.access_token){
      saveSpotifyTokens({...data, refresh_token: data.refresh_token || refreshToken});
      return data.access_token;
    }
    return null;

  function setAlbumGlow(imgEls, imageUrl){
    if(!imageUrl){
      imgEls.forEach(el => el.style.boxShadow = '0 0 0 rgba(255,255,255,0)');
      return;
    }
    const probe = new Image();
    probe.crossOrigin = 'anonymous';
    probe.onload = () => {
      try{
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 32;
        const ctx = canvas.getContext('2d', {willReadFrequently:true});
        ctx.drawImage(probe, 0, 0, 32, 32);
        const pixels = ctx.getImageData(0,0,32,32).data;
        let r=0,g=0,b=0,n=0;
        for(let i=0;i<pixels.length;i+=4){
          const a=pixels[i+3];
          if(a<180) continue;
          r+=pixels[i]; g+=pixels[i+1]; b+=pixels[i+2]; n++;
        }
        if(!n) return;
        r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
        const glow = `0 0 32px 8px rgba(${r},${g},${b},0.28)`;
        imgEls.forEach(el => el.style.boxShadow = glow);
      }catch(e){
        // Some image hosts disallow canvas access; simply keep the neutral glow.
      }
    };
    probe.src = imageUrl;
  }

    const art = data.item.album.images[0]?.url || '';
    const track = data.item.name;
    const artist = data.item.artists.map(a => a.name).join(', ');

    document.getElementById('npArt').src = art;
    document.getElementById('npTrack').textContent = track;
    document.getElementById('npArtist').textContent = artist;
    document.getElementById('panelArt').src = art;
    setAlbumGlow([document.getElementById('npArt'), document.getElementById('panelArt')], art);

    setupMarquee(document.getElementById('npTrack'));

  // scrolls text left-and-right only when it doesn't fit its mask; otherwise
  // sits still. Re-run whenever the text or its container size changes.
  function setupMarquee(trackEl){
    trackEl.classList.remove('animate');
    trackEl.style.removeProperty('--marquee-dist');
    trackEl.style.animationDuration = '';
    requestAnimationFrame(() => {
      const maskEl = trackEl.parentElement;
      const overflow = trackEl.scrollWidth - maskEl.clientWidth;
      if(overflow > 4){
        const dist = -(overflow + 10);
        trackEl.style.setProperty('--marquee-dist', dist + 'px');
        trackEl.style.animationDuration = Math.max(4, Math.abs(dist) / 35) + 's';
        trackEl.classList.add('animate');
      }
    });
  }

  async function pollNowPlaying(){
    const token = await getValidSpotifyToken();
    if(!token){ showConnectPrompt(); return; }
    try{
      const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { Authorization: 'Bearer ' + token }
      });
      if(res.status === 204){ showNothingPlaying(); return; }
      if(res.status === 401){ showConnectPrompt(); return; }
      const data = await res.json();
      if(!data || !data.item){ showNothingPlaying(); return; }
      updateNowPlaying(data);
    }catch(e){ /* network hiccup - keep last known state on screen */ }
  }

  setInterval(() => {
    if(isPlayingNow && localDuration){
      localProgress = Math.min(localDuration, localProgress + 1000);
      renderProgress();
    }
  }, 1000);

  document.getElementById('connectBtn').addEventListener('click', spotifyLogin);

  // Tap/click either progress bar to seek. The iPad touch target is deliberately generous.
  function addSeekHandler(trackEl){
    trackEl.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!localDuration) return;
      const rect = trackEl.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const positionMs = Math.round(localDuration * ratio);
      const token = await getValidSpotifyToken();
      if(!token) return;
      try{
        await fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${positionMs}`, {
          method:'PUT', headers:{Authorization:'Bearer ' + token}
        });
        localProgress = positionMs;
        renderProgress();
      }catch(e){}
    });
  }
  addSeekHandler(document.querySelector('.np-bar-track'));
  addSeekHandler(document.querySelector('.panel-bar-track'));

  // ---------- playback controls ----------
  async function spotifyControl(method, endpoint){
    const token = await getValidSpotifyToken();
    if(!token) return;
    try{
      await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
        method,
        headers: { Authorization: 'Bearer ' + token }
      });
    }catch(e){ /* device may be offline - nothing more we can do here */ }
    // give Spotify a beat to update, then resync real state
    setTimeout(pollNowPlaying, 400);
  }

  document.getElementById('btnPlayPause').addEventListener('click', (e) => {
    e.stopPropagation();
    // optimistic flip so the icon feels instant
    isPlayingNow = !isPlayingNow;
    setPlayPauseIcon();
    spotifyControl('PUT', isPlayingNow ? 'play' : 'pause');
  });
  document.getElementById('btnNext').addEventListener('click', (e) => {
    e.stopPropagation();
    spotifyControl('POST', 'next');
  });
  document.getElementById('btnPrev').addEventListener('click', (e) => {
    e.stopPropagation();
    spotifyControl('POST', 'previous');
  });
  // keep taps inside the panel from bubbling up and collapsing it
  spotifyPanel.addEventListener('click', (e) => e.stopPropagation());
  weatherPanel.addEventListener('click', (e) => e.stopPropagation());

  (async function initSpotify(){
    await handleSpotifyRedirect();
    pollNowPlaying();
    setInterval(pollNowPlaying, 8000);
  })();
</script>
</body>
</html>
